# Legacy single-sensor Z thermal adjustment configuration test
[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[heater_bed]
heater_pin: PH5
sensor_type: PT100 INA826
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 130

[z_thermal_adjust]
temp_coeff: -0.004
sensor_type: temperature_combined
sensor_list: heater_bed
combination_method: mean
maximum_deviation: 999.
smooth_time: 1.
z_adjust_off_above: 1.
max_z_adjustment: 0.5
min_temp: -273.15
max_temp: 200.

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
